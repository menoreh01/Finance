<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Stok</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stok">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">

<style>
  html, body { margin:0; min-height:100%; background:#fff; font-family:Arial,sans-serif; color:#111; }
  body { display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .box { width:min(420px,100%); text-align:center; }
  .icon { width:96px; height:96px; object-fit:contain; border-radius:20px; margin-bottom:20px; }
  h1 { margin:0 0 10px; font-size:26px; }
  p { margin:0 0 20px; line-height:1.5; color:#555; }
  button { border:0; border-radius:12px; padding:13px 20px; font-size:16px; font-weight:600; cursor:pointer; background:#111; color:#fff; }
  .hint { margin-top:16px; font-size:13px; color:#777; }
</style>
</head>
<body>
  <main class="box">
    <img class="icon" src="icon.png" alt="Stok">
    <h1>Stok</h1>
    <p id="message">Halaman ini adalah pintu masuk aplikasi. Tambahkan halaman ini ke layar utama agar ikon Stok digunakan.</p>
    <button id="openApp">Buka Aplikasi</button>
    <div class="hint" id="hint">Setelah ditambahkan ke layar utama, buka dari ikon tersebut. Aplikasi akan langsung menuju Google Apps Script.</div>
  </main>

<script>
const APP_URL = 'https://script.google.com/macros/s/AKfycbyneDtjblJQ2MSMoxptVF69b4AcPRE1gwpgi82Z4Ebko4go6rQzdWJyrAZczYtP3HtK/exec';

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function openApp() {
  window.location.replace(APP_URL);
}

// Jika halaman dibuka dari ikon aplikasi (standalone), langsung teruskan ke Apps Script.
if (isStandalone()) {
  openApp();
}

document.getElementById('openApp').addEventListener('click', openApp);

// Daftarkan service worker agar halaman memenuhi syarat PWA di browser yang mendukungnya.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
